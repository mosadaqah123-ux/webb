<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' width='1920' height='1080'>
  <defs>
    <linearGradient id='heroSky' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#040A14'/>
      <stop offset='45%' stop-color='#0B1930'/>
      <stop offset='85%' stop-color='#102344'/>
      <stop offset='100%' stop-color='#060D1A'/>
    </linearGradient>
    <linearGradient id='pillarGold' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='rgba(181, 161, 129, 0.05)'/>
      <stop offset='50%' stop-color='rgba(181, 161, 129, 0.22)'/>
      <stop offset='100%' stop-color='rgba(181, 161, 129, 0.02)'/>
    </linearGradient>
    <radialGradient id='heroGlow' cx='50%' cy='45%' r='60%'>
      <stop offset='0%' stop-color='#B5A181' stop-opacity='0.22'/>
      <stop offset='50%' stop-color='#0B1930' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#040A14' stop-opacity='0.95'/>
    </radialGradient>
    <pattern id='najdiHeroGrid' width='60' height='60' patternUnits='userSpaceOnUse'>
      <path d='M 30 0 L 60 30 L 30 60 L 0 30 Z' fill='none' stroke='rgba(181, 161, 129, 0.05)' stroke-width='1'/>
    </pattern>
  </defs>
  
  <rect width='1920' height='1080' fill='url(#heroSky)'/>
  <rect width='1920' height='1080' fill='url(#najdiHeroGrid)'/>
  <rect width='1920' height='1080' fill='url(#heroGlow)'/>
  
  <!-- Architectural Fluted Pillars representing Judicial Halls & Authority -->
  <rect x='150' y='0' width='80' height='1080' fill='url(#pillarGold)'/>
  <rect x='320' y='0' width='65' height='1080' fill='url(#pillarGold)'/>
  <rect x='1535' y='0' width='65' height='1080' fill='url(#pillarGold)'/>
  <rect x='1690' y='0' width='80' height='1080' fill='url(#pillarGold)'/>
  
  <!-- Center Arch Silhouette -->
  <path d='M 560 1080 L 560 480 C 560 220 1360 220 1360 480 L 1360 1080' fill='none' stroke='rgba(181, 161, 129, 0.18)' stroke-width='2'/>
  <path d='M 620 1080 L 620 500 C 620 280 1300 280 1300 500 L 1300 1080' fill='none' stroke='rgba(181, 161, 129, 0.1)' stroke-width='1'/>
  
